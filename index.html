<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cloud-Phish Guard</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 100%; min-height: 100vh; }
      body { background: #0a0a0a; }
      #root { width: 100%; min-height: 100vh; }

      /* ── Loader ────────────────────────────────────────── */
      .loader {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: #0a0a0a;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.5s ease;
      }
      .loader.hidden { opacity: 0; pointer-events: none; }

      .loader-logo {
        width: 72px;
        margin-bottom: 28px;
        animation: pulse 2.4s ease-in-out infinite;
      }
      .loader-logo-text {
        font-family: 'Courier New', Courier, monospace;
        color: #dc2626;
        font-size: 11px;
        letter-spacing: 6px;
        text-transform: uppercase;
        margin-bottom: 20px;
        opacity: 0.7;
      }

      /* Loader bar */
      .loader-bar {
        width: 200px;
        height: 3px;
        border-radius: 2px;
        background: #1a1a1a;
        overflow: hidden;
        position: relative;
      }
      .loader-bar::after {
        content: '';
        position: absolute;
        top: 0; left: -60px;
        width: 60px; height: 100%;
        background: linear-gradient(90deg, transparent, #dc2626, #ef4444, #dc2626, transparent);
        border-radius: 2px;
        animation: load 1.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes load {
        0%   { left: -60px; opacity: 0; }
        10%  { opacity: 1; }
        90%  { opacity: 1; }
        100% { left: 200px; opacity: 0; }
      }
      @keyframes pulse {
        0%,100% { opacity: 0.25; transform: scale(1); }
        50%      { opacity: 0.5; transform: scale(1.03); }
      }
    </style>
    <link rel="stylesheet" crossorigin href="./assets/index-CW85vVEA.css" />
  </head>
  <body>
    <div class="loader" id="loader">
      <img src="./assets/logo.png" class="loader-logo" alt="" />
      <div class="loader-logo-text">Cloud-Phish Guard</div>
      <div class="loader-bar"></div>
    </div>

    <div id="root"></div>

    <script type="module" crossorigin src="./assets/index-B8fGm0oR.js"></script>
    <script>
      // Force loader visible for 4 seconds then fade out
      (function() {
        var loader = document.getElementById('loader');
        if (!loader) return;
        setTimeout(function() {
          loader.classList.add('hidden');
          setTimeout(function() { if (loader.parentNode) loader.remove(); }, 550);
        }, 4000);
      })();
    </script>
  </body>
</html>
