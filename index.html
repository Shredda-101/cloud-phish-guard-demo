<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cloud-Phish Guard</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #09090b; font-family: 'Inter', system-ui, sans-serif; overflow-x: hidden; }
      .loader-overlay {
        position: fixed; inset: 0; z-index: 9999;
        background: #09090b;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 2rem;
        transition: opacity 0.8s ease;
      }
      .loader-overlay.hide { opacity: 0; pointer-events: none; }
      .loader-logo {
        width: 120px; aspect-ratio: 485/553;
        background-image: url('./assets/logo.png');
        background-size: contain; background-repeat: no-repeat;
        background-position: center;
        animation: pulse 1.5s ease-in-out infinite;
      }
      .loader {
        width: 48px; aspect-ratio: 1;
        --c: no-repeat linear-gradient(#dc2626 0 0);
        background: var(--c), var(--c), var(--c), var(--c), var(--c), var(--c);
        background-size: 20% 100%; background-position:
          0 0, 0 100%, 50% 50%, 50% 50%, 100% 0, 100% 100%;
        animation: l14-1 .5s infinite alternate, l14-2 2s infinite;
      }
      @keyframes l14-1 {
        0%,10% { background-size: 20% 100%; }
        100%    { background-size: 20% 20%; }
      }
      @keyframes l14-2 {
        0%,49.9% { background-position: 0 0, 0 100%, 50% 50%, 50% 50%, 100% 0, 100% 100%; }
        50%,100% { background-position: 0 50%, 0 50%, 50% 0, 50% 100%, 100% 50%, 100% 50%; }
      }
      @keyframes pulse {
        0%,100% { opacity: 0.7; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.05); }
      }
      .loader-text { color: #71717a; font-size: 0.85rem; letter-spacing: 0.1em; text-transform: uppercase; }
    </style>
    <link rel="stylesheet" href="./assets/index-CW85vVEA.css" />
    <script>setTimeout(() => { document.querySelector('.loader-overlay').classList.add('hide'); }, 4000);</script>
  </head>
  <body>
    <div class="loader-overlay" id="loader">
      <div class="loader-logo"></div>
      <div class="loader"></div>
      <span class="loader-text">Initializing security protocols...</span>
    </div>
    <div id="root"></div>
    <script type="module" src="./assets/index-B8fGm0oR.js"></script>
  </body>
</html>
