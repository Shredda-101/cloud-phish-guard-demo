<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cloud-Phish Guard</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 100%; min-height: 100vh; }
      body { background: #0a0a0a; }
      #root { width: 100%; min-height: 100vh; }
      .loader-wrapper {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        background: #0a0a0a; z-index: 9999;
      }
      .loader-logo {
        width: 100px; height: auto;
        opacity: 0.2; margin-bottom: 32px;
        animation: pulse 2s ease-in-out infinite;
      }
      .loader-bar { width: 200px; height: 2px; background: #18181b; overflow: hidden; }
      .loader-bar::after {
        content: ''; display: block; width: 40%; height: 100%;
        background: linear-gradient(90deg, transparent, #dc2626, transparent);
        animation: l14-1 1.5s linear infinite;
      }
      @keyframes l14-1 { 0% { transform: translateX(-100%); } 100% { transform: translateX(300%); } }
      @keyframes pulse { 0%,100% { opacity: 0.15; } 50% { opacity: 0.25; } }
      .watermark {
        position: absolute; top: 0; left: 0; right: 0; bottom: 0;
        pointer-events: none; z-index: 1;
        display: flex; align-items: center; justify-content: center;
        opacity: 0.04;
      }
      .watermark img { width: 60%; max-width: 700px; height: auto; }
    </style>
    <script type="module" crossorigin src="./assets/index-D9YHmDI4.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CVBuFFRH.css">
  </head>
  <body>
    <div class="loader-wrapper" id="loader">
      <img src="/images/cloud-phish-guard-logo.png" class="loader-logo" alt="" />
      <div class="loader-bar"></div>
    </div>
    <div class="watermark"><img src="/images/cloud-phish-guard-logo.png" alt="" /></div>
    <div id="root" style="display:none"></div>
    <script>
      window.addEventListener('load', () => {
        const r = document.getElementById('root');
        if(r) { r.style.display = ''; const l = document.getElementById('loader'); if(l) l.style.display = 'none'; }
      });
    </script>
  </body>
</html>
